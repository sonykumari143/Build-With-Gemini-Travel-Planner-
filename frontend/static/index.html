<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Planner AI</title>
<!-- Google Material Symbols for A2UI components -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0284c7;
    --accent-gradient: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow: rgba(0, 0, 0, 0.04);
  }

  [data-theme="dark"] {
    --accent: #38bdf8;
    --accent-gradient: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
    --bg: #0f172a;
    --card-bg: #1e293b;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --border: #334155;
    --shadow: rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; transition: background 0.3s, color 0.3s; }
  
  /* Header styling */
  header { background: var(--accent-gradient); color: #fff; padding: 0.9rem 1.4rem; box-shadow: 0 4px 12px var(--shadow); }
  .header-content { max-width: 860px; width: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; flex-direction: column; gap: 0.2rem; }
  .header-title { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.3px; display: flex; align-items: center; gap: 0.5rem; }
  .header-subtitle { font-size: 0.82rem; opacity: 0.95; display: flex; align-items: center; gap: 0.4rem; font-weight: 400; }
  .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px #4ade80; }

  .header-actions { display: flex; gap: 0.5rem; }
  .hdr-btn { background: rgba(255, 255, 255, 0.18); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px; padding: 0.35rem 0.8rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s ease; }
  .hdr-btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-1px); }

  /* Log & Dialogue layout */
  #log { flex: 1; overflow-y: auto; padding: 1.4rem 1rem; max-width: 860px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
  
  .msg { display: flex; gap: 0.75rem; align-items: flex-start; max-width: 90%; animation: fadeIn 0.25s ease-out; }
  .msg.user { margin-left: auto; flex-direction: row-reverse; }
  .msg.agent { margin-right: auto; }

  .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; flex-shrink: 0; box-shadow: 0 2px 6px var(--shadow); }
  .msg.agent .avatar { background: linear-gradient(135deg, #0284c7 0%, #3b82f6 100%); color: #fff; }
  .msg.user .avatar { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: #fff; }

  .msg-content { display: flex; flex-direction: column; gap: 0.3rem; max-width: 100%; position: relative; }
  .msg-header { display: flex; align-items: center; gap: 0.5rem; }
  .msg-sender { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
  .msg.user .msg-header { flex-direction: row-reverse; }
  .msg-time { font-size: 0.7rem; color: var(--text-muted); opacity: 0.8; }

  .bubble { position: relative; display: inline-block; padding: 0.8rem 1.15rem; border-radius: 18px; background: var(--card-bg); border: 1px solid var(--border); text-align: left; color: var(--text); line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; box-shadow: 0 2px 8px var(--shadow); }
  .msg.agent .bubble { border-top-left-radius: 4px; }
  .msg.user .bubble { background: var(--accent-gradient); color: #fff; border: none; border-top-right-radius: 4px; box-shadow: 0 3px 12px rgba(2, 132, 199, 0.25); }
  .bubble.rich { background: transparent; border: none; padding: 0; max-width: 100%; white-space: normal; box-shadow: none; }

  /* Copy button on agent bubbles */
  .copy-btn { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.72rem; padding: 0.25rem 0.55rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); cursor: pointer; margin-top: 0.35rem; align-self: flex-start; transition: all 0.2s; }
  .copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Bouncing typing indicator */
  .typing-indicator { display: flex; align-items: center; gap: 5px; padding: 0.5rem 0.4rem; }
  .typing-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: typing 1.4s infinite ease-in-out; }
  .typing-dot:nth-child(1) { animation-delay: 0s; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; } 40% { transform: scale(1.1); opacity: 1; } }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* Input Form */
  form { display: flex; gap: 0.6rem; padding: 1rem; border-top: 1px solid var(--border); background: var(--card-bg); max-width: 860px; width: 100%; margin: 0 auto; }
  input { flex: 1; padding: 0.8rem 1.1rem; border: 1px solid var(--border); border-radius: 12px; font-size: 1rem; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.2s; }
  input:focus { border-color: var(--accent); }
  button.send-btn { padding: 0.8rem 1.4rem; border: none; border-radius: 12px; background: var(--accent-gradient); color: #fff; font-weight: 600; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
  button.send-btn:hover { opacity: 0.95; transform: translateY(-1px); }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; background: var(--card-bg); box-shadow: 0 4px 12px var(--shadow); max-width: 100%; transition: transform 0.2s, box-shadow 0.2s; }
  .a2card:hover { box-shadow: 0 6px 16px var(--shadow); }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text); }
  .a2text.a2-h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: var(--text); }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 600; color: var(--text); }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; color: var(--text); }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; cursor: pointer; transition: transform 0.2s; }
  .a2img:hover { transform: scale(1.015); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }

  /* Quick prompt chips */
  .quick-prompts { display: flex; gap: 0.5rem; padding: 0.5rem 1rem; max-width: 860px; width: 100%; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
  .quick-prompts::-webkit-scrollbar { display: none; }
  .prompt-chip { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 20px; padding: 0.45rem 0.9rem; font-size: 0.85rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; box-shadow: 0 1px 3px var(--shadow); }
  .prompt-chip:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-1px); }

  /* Image Lightbox Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-content { position: relative; max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column; align-items: center; }
  .modal-content img { max-width: 90vw; max-height: 80vh; border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); object-fit: contain; }
  .modal-actions { display: flex; gap: 0.75rem; margin-top: 1rem; }
  .modal-btn { background: #ffffff; color: #0f172a; border: none; border-radius: 20px; padding: 0.5rem 1.2rem; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
  .modal-btn:hover { background: var(--accent); color: #fff; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="header-left">
      <div class="header-title"><span>✈️</span> Travel Planner AI</div>
      <div class="header-subtitle"><span class="status-dot"></span> AI Concierge & Itinerary Assistant</div>
    </div>
    <div class="header-actions">
      <button type="button" class="hdr-btn" onclick="clearChat()" title="Clear Chat">🗑️ Clear</button>
      <button type="button" class="hdr-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
    </div>
  </div>
</header>

<div id="log"></div>

<div class="quick-prompts" id="prompts-bar">
  <button type="button" class="prompt-chip" onclick="usePrompt('Plan a 3-day itinerary for Tokyo with top attractions and food spots')">🗺️ 3-Day Tokyo Itinerary</button>
  <button type="button" class="prompt-chip" onclick="usePrompt('Show me a map and weather for Paris, France')">📍 Paris Map & Weather</button>
  <button type="button" class="prompt-chip" onclick="usePrompt('Generate a scenic illustration of Mount Fuji at sunset')">🎨 Mount Fuji Illustration</button>
</div>

<form id="form">
  <input id="input" placeholder="Ask something about travel..." autocomplete="off" autofocus>
  <button class="send-btn">Send</button>
</form>

<!-- Lightbox Modal for Full Resolution Images -->
<div class="modal-overlay" id="lightbox" onclick="closeLightbox(event)">
  <div class="modal-content">
    <img id="lightbox-img" src="" alt="Landmark View">
    <div class="modal-actions">
      <a id="lightbox-dl" class="modal-btn" download="destination.jpg" target="_blank">⬇️ Download Image</a>
      <button class="modal-btn" onclick="closeLightbox(event)">✕ Close</button>
    </div>
  </div>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

// --- Theme Toggle ---
function toggleTheme() {
  const current = document.body.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.body.setAttribute("data-theme", next);
  document.getElementById("theme-btn").textContent = next === "dark" ? "☀️" : "🌙";
  localStorage.setItem("tp_theme", next);
}

if (localStorage.getItem("tp_theme") === "dark") {
  toggleTheme();
}

// --- Session Management ---
let currentSessionId = sessionStorage.getItem("tp_session_id");
if (!currentSessionId) {
  currentSessionId = "user-" + Math.random().toString(36).substring(2, 10);
  sessionStorage.setItem("tp_session_id", currentSessionId);
}

function getSessionId() {
  return currentSessionId;
}

// --- Clear Chat ---
function clearChat() {
  log.innerHTML = "";
  currentSessionId = "user-" + Math.random().toString(36).substring(2, 10);
  sessionStorage.setItem("tp_session_id", currentSessionId);
  input.focus();
}

// --- Copy Bubble Content ---
function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.textContent;
    btn.textContent = "✓ Copied!";
    setTimeout(() => { btn.textContent = original; }, 2000);
  });
}

// --- Quick Prompt Trigger ---
function usePrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

// --- Dynamic Follow-up Prompts ---
function updateQuickPrompts(userText, parts) {
  const bar = document.getElementById("prompts-bar");
  const lower = userText.toLowerCase();

  if (lower.includes("tokyo") || lower.includes("japan")) {
    bar.innerHTML = `
      <button type="button" class="prompt-chip" onclick="usePrompt('What is the weather and currency conversion in Tokyo?')">💵 Tokyo Budget & Weather</button>
      <button type="button" class="prompt-chip" onclick="usePrompt('Recommend top 5 ramen and sushi spots in Tokyo')">🍜 Tokyo Food Guide</button>
      <button type="button" class="prompt-chip" onclick="usePrompt('Generate an illustration of Shibuya Crossing at night')">🎨 Shibuya Illustration</button>
    `;
  } else if (lower.includes("paris") || lower.includes("france")) {
    bar.innerHTML = `
      <button type="button" class="prompt-chip" onclick="usePrompt('Plan a 2-day museum tour in Paris with Louvre and Musée d’Orsay')">🏛️ Paris Museums</button>
      <button type="button" class="prompt-chip" onclick="usePrompt('Generate a scenic illustration of Eiffel Tower at dusk')">🎨 Eiffel Tower Visual</button>
      <button type="button" class="prompt-chip" onclick="usePrompt('Show me a map of Montmartre, Paris')">📍 Montmartre Map</button>
    `;
  } else {
    bar.innerHTML = `
      <button type="button" class="prompt-chip" onclick="usePrompt('Plan a 3-day itinerary for Tokyo with top attractions and food spots')">🗺️ 3-Day Tokyo Itinerary</button>
      <button type="button" class="prompt-chip" onclick="usePrompt('Show me a map and weather for Paris, France')">📍 Paris Map & Weather</button>
      <button type="button" class="prompt-chip" onclick="usePrompt('Generate a scenic illustration of Mount Fuji at sunset')">🎨 Mount Fuji Illustration</button>
    `;
  }
}

// --- Lightbox Functions ---
function openLightbox(src) {
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");
  const dl = document.getElementById("lightbox-dl");
  img.src = src;
  dl.href = src;
  lb.classList.add("active");
}

function closeLightbox(ev) {
  if (ev.target.id === "lightbox" || ev.target.tagName === "BUTTON") {
    document.getElementById("lightbox").classList.remove("active");
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.getElementById("lightbox").classList.remove("active");
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function getFormattedTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "✈️");
  const content = el("div", "msg-content");
  
  const header = el("div", "msg-header");
  const sender = el("div", "msg-sender", who === "user" ? "You" : "Travel Concierge");
  const time = el("div", "msg-time", getFormattedTime());
  header.appendChild(sender);
  header.appendChild(time);

  const b = el("div", "bubble");
  
  content.appendChild(header);
  content.appendChild(b);
  m.appendChild(avatar);
  m.appendChild(content);
  
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTyping(b) {
  b.innerHTML = `
    <div class="typing-indicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>`;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v === "number" || typeof v === "boolean") return String(v);
  if (typeof v.literalString === "string") return v.literalString;
  if (typeof v.text === "string") return v.text;
  if (typeof v.value === "string") return v.value;
  if (typeof v.string === "string") return v.string;
  if (typeof v.label === "string") return v.label;
  if (typeof v.title === "string") return v.title;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function renderFormattedText(container, rawText) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  const parts = rawText.split(urlRegex);
  parts.forEach(part => {
    if (part.match(urlRegex)) {
      const a = document.createElement("a");
      a.href = part;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.color = "var(--accent)";
      a.style.textDecoration = "underline";
      a.textContent = part.includes("maps") ? "📍 View Map ↗" : part;
      container.appendChild(a);
    } else {
      container.appendChild(document.createTextNode(part));
    }
  });
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      renderFormattedText(t, boundStr(props.text));
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "Destination View";
      img.onclick = () => openLightbox(src);
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    case "Map":
    case "GoogleMap":
    case "MapView":
    case "LocationMap": {
      let q = boundStr(props.query || props.address || props.place || props.title || props.name);
      const lat = props.latitude || props.lat || (props.location && (props.location.latitude || props.location.lat));
      const lng = props.longitude || props.lng || (props.location && (props.location.longitude || props.location.lng));

      if (!q && lat != null && lng != null) q = `${lat},${lng}`;
      if (!q) q = "Tokyo";

      const container = el("div", "a2map-container");
      container.style.marginTop = "0.5rem";
      container.style.borderRadius = "10px";
      container.style.overflow = "hidden";
      container.style.border = "1px solid var(--border)";

      const iframe = document.createElement("iframe");
      iframe.style.width = "100%";
      iframe.style.height = "220px";
      iframe.style.border = "none";
      iframe.style.display = "block";
      iframe.loading = "lazy";
      iframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(q)}&output=embed`;

      const linkBar = el("div", "a2map-link");
      linkBar.style.padding = "0.45rem 0.7rem";
      linkBar.style.background = "var(--bg)";
      linkBar.style.fontSize = "0.85rem";

      const link = document.createElement("a");
      link.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.style.color = "var(--accent)";
      link.style.textDecoration = "none";
      link.style.fontWeight = "500";
      link.textContent = `📍 Open ${q} in Google Maps ↗`;

      linkBar.appendChild(link);
      container.appendChild(iframe);
      container.appendChild(linkBar);
      return container;
    }
    case "Button": {
      const btn = el("button", "prompt-chip");
      btn.style.background = "var(--accent)";
      btn.style.color = "#fff";
      btn.style.border = "none";
      btn.textContent = boundStr(props.label || props.text || props.title) || "Action";
      const act = boundStr(props.action || props.onClick || props.query);
      if (act) btn.onclick = () => usePrompt(act);
      return btn;
    }
    case "Box":
    case "Container":
    case "Group": {
      const d = el("div", "a2box"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Markdown": {
      const t = el("div", "a2text");
      renderFormattedText(t, boundStr(props.text || props.content || props.source));
      return t;
    }
    default: {
      const children = kids();
      if (children.length) {
        const d = el("div", "a2box"); children.forEach(n => d.appendChild(n)); return d;
      }
      return null;
    }
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) {
        if (c && c.component) {
          const type = Object.keys(c.component)[0];
          const props = c.component[type] || {};
          const txt = boundStr(props.text || props.label || props.title || props.content || props.query);
          if (txt) out.push(txt);
        }
      }
    }
  }
  return out.join("\n").trim();
}

function cleanTextForDisplay(rawText) {
  if (!rawText) return "";
  let txt = String(rawText);
  txt = txt.replace(/<a2ui-json>[\s\S]*?<\/a2ui-json>/g, "");
  txt = txt.replace(/```json[\s\S]*?```/g, "");
  txt = txt.replace(/```[\s\S]*?```/g, "");
  const lines = txt.split("\n").filter(line => {
    const s = line.trim();
    if (!s) return false;
    if (s.startsWith("{") || s.startsWith("[") || s.startsWith('"') || s.startsWith("}") || s.startsWith("]")) return false;
    if (s.endsWith("}") || s.endsWith("]") || s.endsWith("},") || s.endsWith("],") || s.endsWith("{") || s.endsWith("[")) return false;
    if (s.includes(":") && (s.includes('"id"') || s.includes('"component"') || s.includes('"text"') || s.includes('"usageHint"') || s.includes('"literalString"') || s.includes('"explicitList"'))) return false;
    return true;
  });
  return lines.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts
    .filter(p => p && (p.kind === "text" || (!p.kind && p.text)))
    .map(p => cleanTextForDisplay(p.text || ""))
    .filter(Boolean);
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const textDiv = el("div", null);
    renderFormattedText(textDiv, textStr);
    b.appendChild(textDiv);

    // Add Copy Action Button for prose text
    const copyBtn = document.createElement("button");
    copyBtn.className = "copy-btn";
    copyBtn.innerHTML = "📋 Copy Response";
    copyBtn.onclick = () => copyText(copyBtn, textStr);
    b.parentNode.appendChild(copyBtn);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      const flatText = cleanTextForDisplay(flattenText(a2ui));
      if (flatText) b.appendChild(el("div", null, flatText));
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// Event handler
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  
  const b = bubble("agent");
  showTyping(b);

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, user_id: getSessionId() })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
    updateQuickPrompts(text, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
